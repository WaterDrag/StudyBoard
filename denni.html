<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Denní výzva – StudyBoard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%85</text></svg>">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyBoard">
  <script>document.write('<script src="js/version.js?t=' + Date.now() + '"><\/script>');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>document.write('<link rel="stylesheet" href="css/style.css?v='+APP_VERSION+'">');</script>
</head>
<body class="mc-page">

  <nav class="fc-nav">
    <a href="dashboard.html?tab=games" class="icon-btn" aria-label="Zpět na hry" title="Zpět na hry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <span class="fc-nav-title">📅 Denní výzva</span>
  </nav>

  <main class="mc-main">
    <section id="dayIntro" class="mc-setup">
      <div class="mil-logo">📅</div>
      <h1 id="dayTitle">Denní výzva</h1>
      <p class="mc-sub">Každý den 10 otázek z tvých kartiček — hlavně z těch, co ti zrovna nejdou. Na každou máš 20 sekund, rychlá odpověď přidá body. Hraje se jednou denně.</p>
      <div class="day-streak" id="dayStreak"></div>
      <button type="button" class="btn btn-primary mc-start" id="dayStart" disabled>Načítám…</button>
      <p class="mc-hint" id="dayHint"></p>
    </section>

    <section id="dayGame" class="day-game" hidden>
      <div class="day-top">
        <span id="dayQn"></span>
        <span class="day-score" id="dayScore"></span>
      </div>
      <div class="day-timer"><i id="dayTimer"></i></div>
      <div class="mil-question" id="dayQuestion"></div>
      <div class="mil-answers" id="dayAnswers"></div>
    </section>

    <section id="dayDone" class="mc-setup" hidden>
      <div class="mil-logo" id="dayDoneIco">🎉</div>
      <h1 id="dayDoneTitle"></h1>
      <div class="day-result" id="dayResult"></div>
      <div class="day-streak" id="dayStreak2"></div>
      <div class="day-rank-h">Dnešní pořadí s přáteli</div>
      <div class="lb-list" id="dayRank"><div class="lb-empty">Načítám…</div></div>
      <p class="mc-hint" id="dayNext"></p>
      <div class="mc-end-actions"><a class="btn btn-secondary" href="dashboard.html?tab=games">Zpět na hry</a></div>
    </section>
  </main>

  <div class="toast-wrap" id="toastWrap"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script>document.write('<script src="js/codehl.js?v='+APP_VERSION+'"><\/script>');</script>
  <script>document.write('<script src="js/mcgame.js?v='+APP_VERSION+'"><\/script>');</script>
  <script>(function(){var s=document.createElement('script');s.src='js/denni.js?v='+APP_VERSION;document.head.appendChild(s);})();</script>
</body>
</html>
