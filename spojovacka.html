<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Spojovačka – StudyBoard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%8F%B1%EF%B8%8F</text></svg>">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyBoard">
  <script>document.write('<script src="js/version.js?t=' + Date.now() + '"><\/script>');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>document.write('<link rel="stylesheet" href="css/style.css?v='+APP_VERSION+'">');</script>
</head>
<body class="mc-page">

  <nav class="fc-nav">
    <a href="dashboard.html?tab=games" class="icon-btn" aria-label="Zpět na hry" title="Zpět na hry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <span class="fc-nav-title">⏱️ Spojovačka</span>
  </nav>

  <main class="mc-main">
    <section id="spSetup" class="mc-setup">
      <div class="mil-logo">⏱️</div>
      <h1>Spojovačka na čas</h1>
      <p class="mc-sub">Spoj každý pojem s jeho odpovědí. Máš 60 sekund, za vyčištěnou plochu +5 s. Rychlé správné spojení za sebou zvyšuje násobič až na ×5, chyba ho shodí a vezme 3 sekundy.</p>
      <div class="mil-best" id="spBest"></div>
      <div class="mc-decks-h"><b>Z jakých balíčků?</b><button type="button" class="btn btn-ghost btn-sm" id="spAll">Vybrat vše</button></div>
      <div class="mc-decks" id="spDecks"><div class="mc-muted">Načítám balíčky…</div></div>
      <button type="button" class="btn btn-primary mc-start" id="spStart" disabled>Hrát</button>
      <p class="mc-hint" id="spHint"></p>
    </section>

    <section id="spGame" class="sp-game" hidden>
      <div class="sp-hud">
        <span class="sp-time" id="spTime">60</span>
        <span class="sp-combo" id="spCombo"></span>
        <span class="sp-score" id="spScore">0</span>
      </div>
      <div class="day-timer"><i id="spBar"></i></div>
      <div class="sp-board" id="spBoard">
        <div class="sp-col" id="spLeft"></div>
        <div class="sp-col" id="spRight"></div>
      </div>
    </section>

    <section id="spEnd" class="mc-setup" hidden>
      <div class="mil-logo" id="spEndIco">⏱️</div>
      <h1 id="spEndTitle">Čas vypršel</h1>
      <div class="day-result" id="spResult"></div>
      <div class="sp-review" id="spReview"></div>
      <div class="mc-end-actions">
        <button type="button" class="btn btn-primary" id="spAgain">Hrát znovu</button>
        <a class="btn btn-secondary" href="dashboard.html?tab=games">Zpět na hry</a>
      </div>
    </section>
  </main>

  <div class="toast-wrap" id="toastWrap"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script>document.write('<script src="js/sound.js?v='+APP_VERSION+'"><\/script>');</script>
  <script>document.write('<script src="js/mcgame.js?v='+APP_VERSION+'"><\/script>');</script>
  <script>(function(){var s=document.createElement('script');s.src='js/spojovacka.js?v='+APP_VERSION;document.head.appendChild(s);})();</script>
</body>
</html>
