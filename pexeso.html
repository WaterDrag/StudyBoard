<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Pexeso – StudyBoard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%83%8F</text></svg>">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyBoard">
  <script>document.write('<script src="js/version.js?t=' + Date.now() + '"><\/script>');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>document.write('<link rel="stylesheet" href="css/style.css?v='+APP_VERSION+'">');</script>
</head>
<body class="mc-page">

  <nav class="fc-nav">
    <a href="dashboard.html?tab=games" class="icon-btn" aria-label="Zpět na hry" title="Zpět na hry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <span class="fc-nav-title">🃏 Pexeso</span>
  </nav>

  <main class="mc-main">
    <section id="pxSetup" class="mc-setup">
      <div class="mil-logo">🃏</div>
      <h1>Pexeso</h1>
      <p class="mc-sub">Karty jsou otočené. Najdi dvojici: pojem a jeho odpověď. Sám na čas a počet tahů, nebo s přáteli — kdo najde dvojici, hraje znovu.</p>
      <div class="mil-best" id="pxBest"></div>
      <div class="px-modes" role="radiogroup" aria-label="Režim">
        <label class="px-mode"><input type="radio" name="pxMode" value="solo" checked><b>🧑 Sám</b><small>na čas a tahy</small></label>
        <label class="px-mode"><input type="radio" name="pxMode" value="multi"><b>👥 S přáteli</b><small>2–6 hráčů, střídáte se</small></label>
      </div>
      <div class="px-size">Velikost:
        <select id="pxPairs" class="input"><option value="6">6 dvojic</option><option value="8" selected>8 dvojic</option><option value="10">10 dvojic</option><option value="12">12 dvojic</option></select>
      </div>
      <div class="mc-decks-h"><b>Z jakých balíčků?</b><button type="button" class="btn btn-ghost btn-sm" id="pxAll">Vybrat vše</button></div>
      <div class="mc-decks" id="pxDecks"><div class="mc-muted">Načítám balíčky…</div></div>
      <button type="button" class="btn btn-primary mc-start" id="pxStart" disabled>Hrát</button>
      <p class="mc-hint" id="pxHint"></p>
    </section>

    <!-- Čekárna (hra s přáteli) -->
    <section id="pxLobby" class="mc-setup" hidden>
      <div class="mil-logo">👥</div>
      <h1>Čekárna</h1>
      <p class="mc-sub" id="pxLobbyInfo"></p>
      <div class="px-players" id="pxLobbyPlayers"></div>
      <div class="mc-end-actions">
        <button type="button" class="btn btn-secondary" id="pxCopy">🔗 Zkopírovat odkaz</button>
        <button type="button" class="btn btn-primary" id="pxGo" hidden>Začít hru</button>
        <button type="button" class="btn btn-ghost" id="pxLeave">Odejít</button>
      </div>
      <p class="mc-hint" id="pxLobbyHint"></p>
    </section>

    <section id="pxGame" class="px-game" hidden>
      <div class="sp-hud">
        <span class="sp-time" id="pxClock"></span>
        <span class="ws-count" id="pxTurn"></span>
        <span class="sp-score" id="pxMoves"></span>
      </div>
      <div class="px-players px-score" id="pxScores"></div>
      <div class="px-board" id="pxBoard"></div>
      <div class="mc-end-actions"><button type="button" class="btn btn-ghost btn-sm" id="pxSkip" hidden>Hráč nehraje — přeskočit ho</button></div>
    </section>

    <section id="pxEnd" class="mc-setup" hidden>
      <div class="mil-logo" id="pxEndIco">🏆</div>
      <h1 id="pxEndTitle">Hotovo!</h1>
      <div class="day-result" id="pxResult"></div>
      <div class="lb-list" id="pxRank"></div>
      <div class="mc-end-actions">
        <button type="button" class="btn btn-primary" id="pxAgain">Hrát znovu</button>
        <a class="btn btn-secondary" href="dashboard.html?tab=games">Zpět na hry</a>
      </div>
    </section>
  </main>

  <div class="toast-wrap" id="toastWrap"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script>document.write('<script src="js/mcgame.js?v='+APP_VERSION+'"><\/script>');</script>
  <script>document.write('<script src="js/afk.js?v='+APP_VERSION+'"><\/script>');</script>
  <script>(function(){var s=document.createElement('script');s.src='js/pexeso.js?v='+APP_VERSION;document.head.appendChild(s);})();</script>
</body>
</html>
