<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Šibenice – StudyBoard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%94%A4</text></svg>">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyBoard">
  <script>document.write('<script src="js/version.js?t=' + Date.now() + '"><\/script>');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>document.write('<link rel="stylesheet" href="css/style.css?v='+APP_VERSION+'">');</script>
</head>
<body class="mc-page">

  <nav class="fc-nav">
    <a href="dashboard.html?tab=games" class="icon-btn" aria-label="Zpět na hry" title="Zpět na hry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <span class="fc-nav-title">🔤 Šibenice</span>
  </nav>

  <main class="mc-main">
    <section id="hgSetup" class="mc-setup">
      <div class="mil-logo">🔤</div>
      <h1>Šibenice</h1>
      <p class="mc-sub">Podle nápovědy z kartičky hádej pojem písmeno po písmenu. Na každé slovo máš 8 chyb. Háčky a čárky neřeš — „C“ odkryje i „Č“. Hraje se jen z karet, kde je odpovědí krátký pojem.</p>
      <div class="mil-best" id="hgBest"></div>
      <div class="px-modes" role="radiogroup" aria-label="Režim">
        <label class="px-mode"><input type="radio" name="hgMode" value="solo" checked><b>🧑 Sám</b><small>10 slov, rekord</small></label>
        <label class="px-mode"><input type="radio" name="hgMode" value="multi"><b>⚔️ Proti přátelům</b><small>stejná slova, kdo je rychlejší</small></label>
      </div>
      <div class="mc-decks-h"><b>Z jakých balíčků?</b><button type="button" class="btn btn-ghost btn-sm" id="hgAll">Vybrat vše</button></div>
      <div class="mc-decks" id="hgDecks"><div class="mc-muted">Načítám balíčky…</div></div>
      <button type="button" class="btn btn-primary mc-start" id="hgStart" disabled>Hrát</button>
      <p class="mc-hint" id="hgHint"></p>
    </section>

    <!-- Čekárna závodu -->
    <section id="hgLobby" class="mc-setup" hidden>
      <div class="mil-logo">⚔️</div>
      <h1>Závod v šibenici</h1>
      <p class="mc-sub" id="hgLobbyInfo"></p>
      <div class="px-players" id="hgLobbyPlayers"></div>
      <div class="mc-end-actions">
        <button type="button" class="btn btn-secondary" id="hgCopy">🔗 Zkopírovat odkaz</button>
        <button type="button" class="btn btn-primary" id="hgGo" hidden>Spustit závod</button>
        <button type="button" class="btn btn-ghost" id="hgLeave">Odejít</button>
      </div>
      <p class="mc-hint" id="hgLobbyHint"></p>
    </section>

    <section id="hgGame" class="hg-game" hidden>
      <div class="px-players hg-rivals" id="hgRivals" hidden></div>
      <div class="day-top"><span id="hgRound"></span><span class="day-score" id="hgScore"></span></div>
      <div class="hg-stage">
        <svg viewBox="0 0 120 130" class="hg-gallows" id="hgGallows" aria-hidden="true">
          <path class="hg-p" d="M10 122h70"/>
          <path class="hg-p" d="M28 122V10"/>
          <path class="hg-p" d="M28 10h56M28 30l20-20"/>
          <path class="hg-p" d="M84 10v16"/>
          <circle class="hg-p" cx="84" cy="36" r="10"/>
          <path class="hg-p" d="M84 46v34"/>
          <path class="hg-p" d="M84 56l-14 12M84 56l14 12"/>
          <path class="hg-p" d="M84 80l-12 20M84 80l12 20"/>
        </svg>
        <div class="hg-right">
          <div class="hg-hint-lbl" id="hgHintLbl">Nápověda</div>
          <div class="hg-clue" id="hgClue"></div>
          <div class="hg-word" id="hgWord"></div>
          <div class="hg-lives" id="hgLives"></div>
        </div>
      </div>
      <div class="hg-keys" id="hgKeys"></div>
      <div class="hg-actions">
        <button type="button" class="btn btn-ghost" id="hgReveal" title="Odkryje jedno písmeno, stojí 1 chybu">💡 Prozradit písmeno</button>
        <button type="button" class="btn btn-primary" id="hgNext" hidden>Další slovo →</button>
      </div>
    </section>

    <section id="hgEnd" class="mc-setup" hidden>
      <div class="mil-logo" id="hgEndIco">🔤</div>
      <h1 id="hgEndTitle">Konec hry</h1>
      <div class="day-result" id="hgResult"></div>
      <div class="lb-list" id="hgRank"></div>
      <p class="mc-hint" id="hgWait"></p>
      <div class="sp-review" id="hgReview"></div>
      <div class="mc-end-actions">
        <button type="button" class="btn btn-primary" id="hgAgain">Hrát znovu</button>
        <a class="btn btn-secondary" href="dashboard.html?tab=games">Zpět na hry</a>
      </div>
    </section>
  </main>

  <div class="toast-wrap" id="toastWrap"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script>document.write('<script src="js/mcgame.js?v='+APP_VERSION+'"><\/script>');</script>
  <script>(function(){var s=document.createElement('script');s.src='js/sibenice.js?v='+APP_VERSION;document.head.appendChild(s);})();</script>
</body>
</html>
